<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The same repeat bug report with and without the skill</title>
  <rect x="1" y="1" width="958" height="348" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <!-- The request -->
  <rect x="20" y="30" width="200" height="260" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="120" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#8b949e" letter-spacing="1">2ND REPORT</text>
  <text x="120" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#e6edf3">“The menu is</text>
  <text x="120" y="162" text-anchor="middle" font-size="18" font-weight="700" fill="#e6edf3">cut off</text>
  <text x="120" y="189" text-anchor="middle" font-size="18" font-weight="700" fill="#e6edf3">again.”</text>

  <!-- Without lane -->
  <rect x="240" y="30" width="700" height="120" rx="12" fill="#2d1418" stroke="#f85149" stroke-width="1.5"/>
  <text x="256" y="54" font-size="14" font-weight="700" fill="#ff7b72">😩 Without the skill</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="256" y="70" width="150" height="56" rx="8" fill="#4a1d22" stroke="#f85149"/>
    <text x="331" y="103" fill="#ffdcd7">Patch one screen</text>
    <rect x="418" y="70" width="104" height="56" rx="8" fill="#4a1d22" stroke="#f85149"/>
    <text x="470" y="103" fill="#ffdcd7">Comes back</text>
    <rect x="534" y="70" width="116" height="56" rx="8" fill="#4a1d22" stroke="#f85149"/>
    <text x="592" y="103" fill="#ffdcd7">Patch again</text>
    <rect x="662" y="70" width="104" height="56" rx="8" fill="#4a1d22" stroke="#f85149"/>
    <text x="714" y="103" fill="#ffdcd7">Comes back</text>
    <rect x="778" y="70" width="150" height="56" rx="8" fill="#4d3a0f" stroke="#d29922"/>
    <text x="853" y="103" fill="#f8e3a1">Works · report 3+</text>
  </g>

  <!-- With lane -->
  <rect x="240" y="170" width="700" height="120" rx="12" fill="#12261b" stroke="#3fb950" stroke-width="1.5"/>
  <text x="256" y="194" font-size="14" font-weight="700" fill="#56d364">😌 With the skill</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="256" y="210" width="128" height="56" rx="8" fill="#1a3d28" stroke="#3fb950"/>
    <text x="320" y="243" fill="#d2f4dc">Checks history</text>
    <rect x="394" y="210" width="112" height="56" rx="8" fill="#1a3d28" stroke="#3fb950"/>
    <text x="450" y="243" fill="#d2f4dc">Fix + guard</text>
    <rect x="516" y="210" width="128" height="56" rx="8" fill="#238636" stroke="#56d364"/>
    <text x="580" y="243" fill="#ffffff">Fixed for good</text>
  </g>
  <rect x="656" y="210" width="272" height="56" rx="8" fill="none" stroke="#56d364" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="792" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#56d364">Time you get back</text>
  <text x="792" y="255" text-anchor="middle" font-size="12" fill="#8b949e">no third report</text>

  <!-- Time arrow -->
  <line x1="240" y1="318" x2="920" y2="318" stroke="#8b949e" stroke-width="2"/>
  <path d="M920 312 L934 318 L920 324 Z" fill="#8b949e"/>
  <text x="240" y="340" font-size="12" fill="#8b949e">time</text>
</svg>
